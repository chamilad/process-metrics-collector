[build-system]
requires = [
	"setuptools>=42",
	"wheel"
]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
ignore = [
	"BLE001",
	"C405",
	"C406",
	"C408",
	"C417",
	"EXE001",
	"FLY002",
	"I001",
	"PIE808",
	"PYI032",
	"RUF059",
	"SIM102",
	"UP006",
	"UP007",
	"UP009",
	"UP030",
	"UP032",
	"UP035",
	"UP036",
	"UP037",
	"UP043",
	"UP045"
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/mypy-stubs"