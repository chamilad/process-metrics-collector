name: pre-commit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [exec]
    paths-ignore:
      - 'installation/constraints-*[0-9].txt'

jobs:
  pre-commit-26_04:
    uses: ./.github/workflows/pre-commit_common.yml
    with:
      platform: ubuntu-26.04
      matrix: '{"python-version": [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]}'

  pre-commit-24_04:
    uses: ./.github/workflows/pre-commit_common.yml
    with:
      platform: ubuntu-24.04
      matrix: '{"python-version": [ "3.9" ]}'

  pull_request_changes:
    # Do this only when it is not a pull request validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Pull request with the newly generated contents
    needs:
      - pre-commit-26_04
      - pre-commit-24_04
    steps:
      - name: Get analysis timestamp
        id: timestamp
        run: echo "timestamp=$(date -Is)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        id: download
        with:
          pattern: pre-commit-*
          merge-multiple: true
          path: changes-dir
      - name: Move artifacts to their right place
        id: move
        run: |
          skip=true
          if [ -d "${{steps.download.outputs.download-path}}" ] ; then
            for con in "${{steps.download.outputs.download-path}}"/installation/constraints-*.txt ; do
              case "$con" in
                */constraints-\*.txt)
                  break
                  ;;
                *)
                  cp -p "$con" installation
                  skip=false
                  ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        if: steps.move.outputs.skip == 'false'
        with:
          title: Updated constraints (triggered on ${{ steps.timestamp.outputs.timestamp }} by ${{ github.sha }})
          branch: create-pull-request/patch-constraints
          add-paths: installation/constraints-*.txt
          delete-branch: true
          commit-message: "[create-pull-request] Automatically commit updated contents (constraints)"
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
